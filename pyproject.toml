[project]
name = "fcp"
version = "0.1.0"
description = "Full Court Press V2 — fantasy basketball league history and intelligence"
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz>=3.9",
    "espn-api>=0.19.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The `capture` marker gates tests that import V1 and therefore cvxpy/pandas.
# They are deselected by default so the normal suite stays dependency-light.
# Run them deliberately with an explicit V1 checkout:
#   D09_V1_ROOT=/path/to/v1-worktree pytest -m capture
addopts = "-q -m 'not capture'"
markers = [
    "capture: imports V1 (cvxpy/pandas); opt-in, needs --v1-root",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends/Header/Query/Path as argument defaults is the framework's
# idiomatic dependency-injection pattern, not a foot-gun.
"backend/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "migrations"]

[[tool.mypy.overrides]]
module = "espn_api.*"
ignore_missing_imports = true
